openapi: 3.1.0

# The context-management module's HTTP surface. Optional: where the module is not provided these
# routes do not exist. Reading contexts stays in the core description; what is optional is making
# and removing them. A pod providing this module can have an empty registry.

info:
  title: sempods — context management module
  version: '0.1-dev'
  summary: Creating and deleting the contexts a pod holds.
  description: |
    Binds only an implementation advertising
    `https://schema.sempods.org/module/context-management` at the conformance endpoint.

    The route and the context IRI are one string, so there is no identifier to map and nothing to
    migrate when the namespace moves. A fixed deployment may omit this module and provision its
    contexts outside this interface. Reading its contexts still works: `GET
    /_system/contexts` and `GET /_system/contexts/{contextPath}` are core.

    Requirements here carry `SPS-CTX-` identifiers, the same area the core contexts chapter uses.
    An identifier is permanent, so it says which area a requirement belongs to and nothing about
    whether an implementation must satisfy it — the chapter says that.
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0

externalDocs:
  description: The module chapter
  url: https://github.com/sempods/sempods-spec/blob/main/spec/modules/context-management.md

servers:
  - url: '{podBaseUrl}'
    variables:
      podBaseUrl: { default: 'https://example.org/alice' }

security:
  - bearerAuth: []
  - oauth2: []

paths:

  /_system/contexts/{contextPath}:
    parameters:
      - $ref: '#/components/parameters/ContextPath'
    put:
      operationId: putContext
      summary: Create a context, idempotently.
      description: "The body is optional. Where the `public` flag is absent \u2014 including on a request with no\nbody at all \u2014 the context is created **private**: the quiet path is the one without a body,\nand a context becomes readable without a grant because somebody said so, never because they\nsaid nothing.\n\nSuccessful responses are registry RDF (SPS-CTX-037). Negotiate the response before creation; an unsatisfiable Accept gives 406 without mutation. JSON input and create-only effects are unchanged. Every registry response, including errors, preserves the cache isolation and freshness of SPS-CTX-036.\n"
      x-sps-requirements: [SPS-CORE-015, SPS-CORE-018, SPS-CTX-005, SPS-CTX-009, SPS-CTX-012, SPS-CTX-013, SPS-CTX-014, SPS-CTX-015, SPS-CTX-016, SPS-CTX-019, SPS-CTX-027, SPS-CTX-037, SPS-AUTH-064]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextCreate'
      responses:
        '200':
          description: The context already existed and was not altered.
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ContextDescription'
              example:
                '@id': https://example.org/alice/_system/contexts/tasks
                '@type':
                - http://www.w3.org/ns/sparql-service-description#NamedGraph
                http://www.w3.org/ns/sparql-service-description#name:
                - '@id': https://example.org/alice/_system/contexts/tasks
                http://www.w3.org/2000/01/rdf-schema#label:
                - '@value': Tasks
                https://schema.sempods.org/public:
                - '@value': false
                http://www.w3.org/2000/01/rdf-schema#seeAlso:
                - '@id': https://example.org/alice/_system/resources/aHR0cHM6Ly9leGFtcGxlLm9yZy9hbGljZS9fc3lzdGVtL2NvbnRleHRzL3Rhc2tz
            application/n-quads:
              schema:
                type: string
                description: The same registry RDF in the default graph.
          headers:
            Vary:
              schema:
                type: string
              description: Includes Accept.
            Cache-Control:
              $ref: '#/components/headers/RegistryCacheControl'
        '201':
          description: Created.
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ContextDescription'
              example:
                '@id': https://example.org/alice/_system/contexts/tasks
                '@type':
                - http://www.w3.org/ns/sparql-service-description#NamedGraph
                http://www.w3.org/ns/sparql-service-description#name:
                - '@id': https://example.org/alice/_system/contexts/tasks
                http://www.w3.org/2000/01/rdf-schema#label:
                - '@value': Tasks
                https://schema.sempods.org/public:
                - '@value': false
                http://www.w3.org/2000/01/rdf-schema#seeAlso:
                - '@id': https://example.org/alice/_system/resources/aHR0cHM6Ly9leGFtcGxlLm9yZy9hbGljZS9fc3lzdGVtL2NvbnRleHRzL3Rhc2tz
            application/n-quads:
              schema:
                type: string
                description: The same registry RDF in the default graph.
          headers:
            Vary:
              schema:
                type: string
              description: Includes Accept.
            Cache-Control:
              $ref: '#/components/headers/RegistryCacheControl'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '403':
          $ref: '#/components/responses/RegistryForbidden'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '406':
          $ref: '#/components/responses/RegistryNotAcceptable'
      parameters:
      - $ref: '#/components/parameters/RegistryAccept'
    delete:
      operationId: deleteContext
      summary: Remove a context and the state that rested on it.
      description: |
        Removes the grants naming the context and its statements (`SPS-CTX-017`). Does
        **not** cascade into sub-contexts: deleting `R` leaves `R/sub`.

        An authorized caller can remove its only visible context, including the pod's last
        registered context. Both cases succeed with `204`.
      x-sps-requirements: [SPS-CORE-018, SPS-CTX-017, SPS-CTX-018, SPS-CTX-019, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NoSuchContext' }

components:

  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    oauth2:
      type: oauth2
      description: |
        The same pod-issued token the core surface uses, obtained the same way — this module adds
        no authorization surface of its own. `spec/core/auth.md` is where the flow is specified.
        It is repeated here because an OpenAPI description stands alone: a client that authorized
        against the core description holds a credential this one has to name before it may be
        attached, and without that its operations stay anonymous.

        The endpoint URLs name the same placeholder pod as `servers` and do not follow it —
        substitute your pod here as well as there. The core description says why.
      flows:
        authorizationCode:
          authorizationUrl: 'https://example.org/alice/_system/auth/authorize'
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          refreshUrl: 'https://example.org/alice/_system/auth/token'
          scopes:
            public-read: >-
              The pod's currently public contexts, unioned into the caller's readable set on top of
              the grants resolved from storage (`SPS-GRANT-020`). With an identity established it
              is an ordinary additive scope.
        clientCredentials:
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          scopes: {}

  parameters:

    RegistryAccept:
      name: Accept
      in: header
      required: false
      schema:
        type: string
      description: JSON-LD by default; application/json requests receive application/ld+json. N-Quads is also supported; no acceptable representation gives 406.

    ContextPath:
      name: contextPath
      in: path
      required: true
      schema: { type: string }
      description: |
        The context IRI's path, and the same string as the IRI's own. May contain slashes.

  headers:

    RegistryCacheControl:
      description: >-
        RFC 9111 cache policy satisfying SPS-CTX-036 for every registry response, including errors.
        Stored responses preserve caller/client authorization isolation, current authorization and
        representation freshness. No-store is one sufficient strategy; private storage with mandatory
        revalidation also requires cache selection to distinguish authorization inputs and negotiated
        variants. No particular header combination is prescribed.
      schema: { type: string }
      examples:
        noStore:
          value: no-store
        revalidate:
          summary: Private revalidation with authorization-aware cache selection.
          value: private, no-cache

  responses:

    AuthenticationRequired:
      description: >-
        Authentication is required. Missing and rejected bearer tokens produce the same
        401 response with invalid_token (SPS-CORE-015). Context lifecycle writes have no public-read exception.
      headers:
        WWW-Authenticate:
          required: true
          description: >-
            RFC 6750 Bearer challenge with the pod-local resource_metadata URL required by
            SPS-AUTH-064. Rejected credentials carry invalid_token.
          schema: { type: string }
          example: 'Bearer error="invalid_token", resource_metadata="https://example.org/alice/.well-known/oauth-protected-resource"'
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    RegistryNotAcceptable:
      description: The `Accept` header cannot be satisfied; registry cache isolation still applies.
      headers:
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    RegistryBadRequest:
      description: The request could not be understood, or names a context path that is refused.
      headers:
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    RegistryForbidden:
      description: |
        Authenticated, but lacking the owner or context-management authority required for creation.
        Status, headers and content do not distinguish whether the target exists (`SPS-CORE-018`).
        A creation-only naming rejection does not take precedence over this denial.
      headers:
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    Forbidden:
      description: |
        A valid token whose grants do not cover this operation. The pod owner, or a `#manage` grant
        covering the target under the slash-delimited rule, is what this route requires.
        Status, headers and content do not distinguish whether the target exists (`SPS-CORE-018`).
    NoSuchContext:
      description: No such context, for the pod owner or a caller whose manage grant covers the path.

  schemas:

    RegistryIri:
      type: object
      required:
      - '@id'
      properties:
        '@id':
          type: string
          format: iri
      additionalProperties: false

    RegistryLiteral:
      type: object
      required:
      - '@value'
      properties:
        '@value':
          type:
          - string
          - boolean
          - number
        '@type':
          type: string
          format: iri
        '@language':
          type: string
      additionalProperties: false
      not:
        required:
        - '@type'
        - '@language'

    RegistryNode:
      type: object
      required:
      - '@id'
      - '@type'
      properties:
        '@id':
          type: string
          format: iri
        '@type':
          type: array
          items:
            type: string
            format: iri
          minItems: 1
          uniqueItems: true
      propertyNames:
        anyOf:
        - enum:
          - '@id'
          - '@type'
        - format: iri
      additionalProperties:
        type: array
        items:
          oneOf:
          - $ref: '#/components/schemas/RegistryIri'
          - $ref: '#/components/schemas/RegistryLiteral'

    ContextDescription:
      allOf:
      - $ref: '#/components/schemas/RegistryNode'
      - type: object
        required:
        - http://www.w3.org/ns/sparql-service-description#name
        - https://schema.sempods.org/public
        - http://www.w3.org/2000/01/rdf-schema#seeAlso
        properties:
          '@type':
            contains:
              const: http://www.w3.org/ns/sparql-service-description#NamedGraph
          http://www.w3.org/ns/sparql-service-description#name:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            minItems: 1
            maxItems: 1
          https://schema.sempods.org/public:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: boolean
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#boolean
              additionalProperties: false
            minItems: 1
            maxItems: 1
          http://www.w3.org/2000/01/rdf-schema#seeAlso:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            minItems: 1
          http://www.w3.org/2000/01/rdf-schema#label:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: string
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#string
                '@language':
                  type: string
              additionalProperties: false
              not:
                required: ['@type', '@language']
            minItems: 1
            maxItems: 1
          http://purl.org/dc/terms/description:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: string
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#string
                '@language':
                  type: string
              additionalProperties: false
              not:
                required: ['@type', '@language']
            minItems: 1
            maxItems: 1
          http://purl.org/dc/terms/created:
            type: array
            items:
              type: object
              required:
              - '@value'
              - '@type'
              properties:
                '@value':
                  type: string
                  description: >-
                    An xsd:dateTime lexical form (SPS-CTX-032), including forms without a timezone.
                    JSON Schema's date-time format denotes RFC 3339 and is narrower; this schema
                    checks the string representation and datatype, not XSD lexical validity.
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#dateTime
              additionalProperties: false
            minItems: 1
            maxItems: 1
          https://schema.sempods.org/readableContext: false
          https://schema.sempods.org/writableContext: false
          https://schema.sempods.org/manageableContext: false
      description: Registry RDF about the Context. sd:name equals @id; seeAlso is its derived system resource address. Caller rights and ordinary data are excluded (SPS-CTX-032).

    ContextCreate:
      type: object
      properties:
        label: { type: string }
        description: { type: string }
        public: { type: boolean }
