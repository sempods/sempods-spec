openapi: 3.1.0

# The core HTTP surface of a sempods pod. Hand-written and part of the contract — not generated
# from any implementation, because a generated description specifies whatever one implementation
# happens to do, and an implementer in another language would read its choices as obligations.
#
# What this file cannot carry is the reason it is not the specification on its own: grant
# resolution, the context sandbox and the SPARQL sandbox decide what a request may see, and no
# schema language expresses them. Every operation therefore names the requirements it realises in
# `x-sps-requirements`, and those are where the behaviour lives.

info:
  title: sempods — core
  version: '0.1-dev'
  summary: The HTTP surface every sempods implementation provides.
  description: |
    The routes a conformant implementation must serve. Behaviour is specified in the core chapters
    of the sempods specification; each operation below names the requirement identifiers it
    realises.

    **This description is not sufficient to implement a pod.** What a caller may see is decided by
    grants resolved server-side per request, by the context sandbox on every read and write, and by
    the SPARQL sandbox on every query. None of that is expressible here.
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
  contact:
    name: sempods
    url: https://github.com/sempods/sempods-spec

externalDocs:
  description: The specification
  url: https://github.com/sempods/sempods-spec/blob/main/spec/README.md

servers:
  - url: '{podBaseUrl}'
    description: A pod. Every route below is relative to it.
    variables:
      podBaseUrl:
        default: https://example.org/alice
        description: >-
          The pod's base URL, and the address the pod is publicly known by — its resource IRIs are
          minted from it. One variable rather than an origin and a pod name, because `SPS-CORE-007`
          does not prescribe how the URL decomposes: a path under a shared origin, a host of the
          pod's own, and an origin that is a single pod are the same pod here.

tags:
  - name: conformance
    description: What this implementation provides.
  - name: contexts
    description: |
      The permission boundary — discovery, and what a context IRI may be. Creating and deleting
      them is the context-management module, in its own description.
  - name: resources
    description: RDF CRUD, at the resource's own IRI and at its operations address.
  - name: slots
    description: Triple-granular CRUD on one `(subject, predicate)` pair.
  - name: query
    description: The read-only SPARQL surface.
  - name: retrieval
    description: Text in, a subgraph out.
  - name: auth
    description: OAuth 2.1, registration, keys, metadata.

# Bearer by default. Anonymous is a supported mode on this pod — SPS-MCP-005 and the public-read
# flow depend on it — but it is a property of specific *read* operations, not of the surface, and
# declaring it at the root advertised every mutation as reachable without a token. The operations
# that genuinely take no credential override this with `security: [{}]`, and the read operations
# that work either way list both.
security:
  - bearerAuth: []
  - oauth2: []

paths:

  /_system/conformance:
    get:
      tags: [conformance]
      operationId: getConformance
      summary: The specification version and the modules this pod provides.
      description: |
        Unauthenticated on purpose: a client has to be able to ask what it is talking to before it
        knows whether it can authenticate.
      security: [{}]
      x-sps-requirements: [SPS-CORE-010, SPS-CORE-011, SPS-CORE-012, SPS-CORE-013]
      responses:
        '200':
          description: The conformance claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conformance' }

  /_system/contexts:
    get:
      tags:
      - contexts
      operationId: listContexts
      security:
      - {}
      - bearerAuth: []
      - oauth2: []
      summary: The contexts visible to the caller, with effective permissions.
      description: 'The authoritative client-visible view of effective context permissions. A token''s `scope`

        claim is not a context catalogue, and a client never constructs a context IRI itself.


        Returns registry RDF; application/json is a request alias for application/ld+json, not the legacy JSON envelope. Every response, including errors, satisfies the authorization isolation and freshness guarantees of SPS-CTX-036. Ordinary data and caller-independent descriptions remain separate from the catalogue access summary.

        '
      x-sps-requirements: [SPS-CTX-021, SPS-CTX-022, SPS-CTX-023, SPS-CTX-031, SPS-CTX-033, SPS-CTX-034, SPS-CTX-035, SPS-CTX-036, SPS-AUTH-064]
      responses:
        '200':
          description: The authorized registry representation.
          headers:
            ETag:
              schema:
                type: string
              description: Strong tag for this authorized registry representation.
            Vary:
              schema:
                type: string
              description: Includes Accept.
            Cache-Control:
              $ref: '#/components/headers/RegistryCacheControl'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ContextCatalogue'
              example:
                '@id': https://example.org/alice/_system/contexts
                '@type':
                - http://www.w3.org/ns/sparql-service-description#GraphCollection
                http://www.w3.org/ns/sparql-service-description#namedGraph:
                - '@id': https://example.org/alice/_system/contexts/tasks
                https://schema.sempods.org/readableContext:
                - '@id': https://example.org/alice/_system/contexts/tasks
                https://schema.sempods.org/writableContext:
                - '@id': https://example.org/alice/_system/contexts/tasks
            application/n-quads:
              schema:
                type: string
                description: The same registry RDF in the default graph.
        '304':
          $ref: '#/components/responses/RegistryNotModified'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
        '406':
          $ref: '#/components/responses/RegistryNotAcceptable'
      parameters:
      - $ref: '#/components/parameters/RegistryAccept'
      - $ref: '#/components/parameters/IfNoneMatch'
  /_system/contexts/{contextPath}:
    parameters:
    - $ref: '#/components/parameters/ContextPath'
    get:
      tags:
      - contexts
      operationId: getContext
      security:
      - {}
      - bearerAuth: []
      - oauth2: []
      summary: What the registry holds for this context.
      description: 'Ask this route what a context **is**. What anyone has *said about* the same IRI is a

        different question, answered by the resource routes.


        Returns registry RDF; application/json is a request alias for application/ld+json, not the legacy JSON envelope. Every response, including errors, satisfies the authorization isolation and freshness guarantees of SPS-CTX-036. Ordinary data and caller-independent descriptions remain separate from the catalogue access summary.

        '
      x-sps-requirements: [SPS-CTX-024, SPS-CTX-026, SPS-CTX-031, SPS-CTX-032, SPS-CTX-035, SPS-CTX-036, SPS-AUTH-064]
      responses:
        '200':
          description: The authorized registry representation.
          headers:
            ETag:
              schema:
                type: string
              description: Strong tag for this authorized registry representation.
            Vary:
              schema:
                type: string
              description: Includes Accept.
            Cache-Control:
              $ref: '#/components/headers/RegistryCacheControl'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/ContextDescription'
              example:
                '@id': https://example.org/alice/_system/contexts/tasks
                '@type':
                - http://www.w3.org/ns/sparql-service-description#NamedGraph
                http://www.w3.org/ns/sparql-service-description#name:
                - '@id': https://example.org/alice/_system/contexts/tasks
                http://www.w3.org/2000/01/rdf-schema#label:
                - '@value': Tasks
                https://schema.sempods.org/public:
                - '@value': false
                http://www.w3.org/2000/01/rdf-schema#seeAlso:
                - '@id': https://example.org/alice/_system/resources/aHR0cHM6Ly9leGFtcGxlLm9yZy9hbGljZS9fc3lzdGVtL2NvbnRleHRzL3Rhc2tz
            application/n-quads:
              schema:
                type: string
                description: The same registry RDF in the default graph.
        '304':
          $ref: '#/components/responses/RegistryNotModified'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
        '406':
          $ref: '#/components/responses/RegistryNotAcceptable'
        '404':
          $ref: '#/components/responses/RegistryNotFoundOrNotVisible'
      parameters:
      - $ref: '#/components/parameters/RegistryAccept'
      - $ref: '#/components/parameters/IfNoneMatch'

  /{resourcePath}:
    description: |
      The LOD layer. `resourcePath` is everything after the pod's base URL — not after a pod path
      segment, which a pod that is an entire origin does not have — and **may contain slashes**.
      OpenAPI path templating has no multi-segment parameter, so tooling will show it as one
      segment. A path equal to `_system` or `.well-known`, or beginning with either of them
      followed by `/`, is not addressable here.
    parameters:
      - $ref: '#/components/parameters/ResourcePath'
    get:
      tags: [resources]
      operationId: getResource
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: Dereference a resource.
      parameters:
        - $ref: '#/components/parameters/ReadContext'
        - $ref: '#/components/parameters/IncludeContexts'
      x-sps-requirements: [SPS-CRUD-014, SPS-CRUD-015, SPS-CRUD-017, SPS-CRUD-020, SPS-CRUD-021, SPS-CRUD-022, SPS-CRUD-026, SPS-CRUD-027, SPS-CRUD-029, SPS-CRUD-058, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { $ref: '#/components/responses/ResourceRepresentation' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFoundOrNotVisible' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
    head:
      tags: [resources]
      operationId: headResource
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: The headers of a dereference, with no body.
      x-sps-requirements: [SPS-CRUD-018, SPS-CRUD-029, SPS-CRUD-058, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: Headers only.
          headers:
            Link: { $ref: '#/components/headers/EditLinks' }
        '404': { $ref: '#/components/responses/NotFoundOrNotVisible' }
    options:
      tags: [resources]
      operationId: optionsResource
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: The verbs available to this caller on this resource.
      x-sps-requirements: [SPS-CRUD-018]
      responses:
        '204':
          description: Allowed methods.
          headers:
            Allow: { schema: { type: string } }
    put:
      tags: [resources]
      operationId: putResource
      summary: Replace the resource's outgoing statements in one context.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-007, SPS-CRUD-008, SPS-CRUD-011, SPS-CRUD-012, SPS-CRUD-031, SPS-CRUD-032, SPS-CRUD-033, SPS-CRUD-034, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: { $ref: '#/components/schemas/CanonicalResource' }
          application/n-quads:
            schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { description: Replaced. }
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string, format: uri } }
        '204': { description: Replaced, no body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    patch:
      tags: [resources]
      operationId: patchResource
      summary: RFC 7396 merge patch on the canonical representation.
      description: |
        JSON Merge Patch, not a JSON-LD processing mode. Absolute IRI keys only; `@context`,
        `@graph` and every other keyword except `@id` and `@type` are rejected. Arrays are replaced
        wholesale — adding one value to a multivalued property is a slot operation.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-035, SPS-CRUD-036, SPS-CRUD-037, SPS-CRUD-038, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { description: Patched. }
        '204': { description: Patched, no body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WriteTargetNotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: Remove the resource's outgoing statements in one context.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-039, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WriteTargetNotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /_system/resources/{resourceIri}:
    description: |
      The same resource, addressed by base64url-encoded IRI. For a pod-owned IRI this behaves
      identically to the LOD path — same body, same entity tag, same rules. For an IRI outside the
      pod namespace it is the only route that exists.
    parameters:
      - $ref: '#/components/parameters/ResourceIri'
    get:
      tags: [resources]
      operationId: getResourceByIri
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: Dereference any IRI's statements held by this pod.
      parameters:
        - $ref: '#/components/parameters/ReadContext'
        - $ref: '#/components/parameters/IncludeContexts'
      x-sps-requirements: [SPS-CRUD-001, SPS-CRUD-002, SPS-CRUD-003, SPS-CRUD-005, SPS-CRUD-006, SPS-CRUD-058, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { $ref: '#/components/responses/ResourceRepresentation' }
        '404': { $ref: '#/components/responses/NotFoundOrNotVisible' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
    head:
      tags: [resources]
      operationId: headResourceByIri
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: The headers of that dereference, with no body.
      x-sps-requirements: [SPS-CRUD-040, SPS-CRUD-058, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: Headers only.
          headers:
            Link: { $ref: '#/components/headers/EditLinks' }
        '404': { $ref: '#/components/responses/NotFoundOrNotVisible' }
    options:
      tags: [resources]
      operationId: optionsResourceByIri
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: The verbs available to this caller on this IRI.
      x-sps-requirements: [SPS-CRUD-040]
      responses:
        '204':
          description: Allowed methods.
          headers:
            Allow: { schema: { type: string } }
    put:
      tags: [resources]
      operationId: putResourceByIri
      summary: Replace any IRI's statements in one context.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-002, SPS-CRUD-011, SPS-CRUD-031, SPS-CRUD-032, SPS-CRUD-043, SPS-AUTH-064]
      requestBody:
        required: true
        description: |
          The same media types as the LOD path — SPS-CRUD-002 requires the two addresses to behave
          identically, and this is the *only* write address for an IRI outside the pod namespace.
        content:
          application/ld+json:
            schema: { $ref: '#/components/schemas/CanonicalResource' }
          application/n-quads:
            schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { description: Replaced. }
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    patch:
      tags: [resources]
      operationId: patchResourceByIri
      summary: Merge patch any IRI's statements in one context.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-002, SPS-CRUD-035, SPS-CRUD-036, SPS-CRUD-037, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { description: Patched. }
        '204': { description: Patched, no body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WriteTargetNotFound' }
    delete:
      tags: [resources]
      operationId: deleteResourceByIri
      summary: Remove any IRI's statements in one context.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-002, SPS-CRUD-039, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WriteTargetNotFound' }

  /_system/resources/{subjectIri}/{predicateIri}:
    description: A slot — every value of one `(subject, predicate)` pair within one context.
    parameters:
      - $ref: '#/components/parameters/SubjectIri'
      - $ref: '#/components/parameters/PredicateIri'
    get:
      tags: [slots]
      operationId: getSlot
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: All values of this slot.
      description: |
        An unordered set. Array order is not meaningful and may differ between calls. An entity tag
        is emitted only where the read resolves to exactly one context — a union of several
        snapshots is not something a single tag can validate.
      parameters:
        - $ref: '#/components/parameters/ReadContext'
        - $ref: '#/components/parameters/IncludeContexts'
      x-sps-requirements: [SPS-CRUD-041, SPS-CRUD-046, SPS-CRUD-050, SPS-CRUD-051, SPS-CRUD-057, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: The slot's values.
          content:
            application/ld+json:
              schema: { $ref: '#/components/schemas/SlotValues' }
        '404': { $ref: '#/components/responses/NotFoundOrNotVisible' }
    put:
      tags: [slots]
      operationId: putSlot
      summary: Replace the slot's contents; an empty array clears it.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatchSlot'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-041, SPS-CRUD-048, SPS-CRUD-052, SPS-CRUD-053, SPS-CRUD-054, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/ld+json:
            schema: { $ref: '#/components/schemas/SlotValues' }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: Replaced. Carries the slot's new entity tag.
          headers:
            ETag: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    post:
      tags: [slots]
      operationId: addSlotValue
      summary: Add a value to the slot.
      description: |
        Idempotent in practice — adding a statement that already exists is a no-op under RDF set
        semantics — so a client may retry without a conditional header. The verb stays `POST`
        because it means *extend*, not *replace*. `Location` is the unambiguous signal that a new
        edge was created.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-044, SPS-CRUD-045, SPS-CRUD-047, SPS-CRUD-049, SPS-CRUD-052, SPS-CRUD-054, SPS-AUTH-064]
      requestBody:
        required: true
        description: One value, or several — SPS-CRUD-041 defines the verb as adding the given value or values.
        content:
          application/ld+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SlotValue'
                - $ref: '#/components/schemas/SlotValues'
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: |
            The value was already present. Carries the slot's tag like any other successful slot
            mutation, so a client can chain a conditional write without an intervening `GET` — the
            no-op outcome is the ordinary one for an "ensure this triple exists" pattern.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outcome' }
        '201':
          description: A new edge was created.
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }
    delete:
      tags: [slots]
      operationId: clearSlot
      summary: Empty the slot.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
        - $ref: '#/components/parameters/IfMatch'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-041, SPS-CRUD-044, SPS-CRUD-052, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: '`cleared`, or `already_empty`. Carries the post-clear entity tag.'
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }

  /_system/resources/{subjectIri}/{predicateIri}/{targetIri}:
    description: One edge. Available only where the target is an IRI — a literal has no path encoding.
    parameters:
      - $ref: '#/components/parameters/SubjectIri'
      - $ref: '#/components/parameters/PredicateIri'
      - $ref: '#/components/parameters/TargetIri'
    delete:
      tags: [slots]
      operationId: removeEdge
      summary: Remove exactly one edge, leaving the slot's other values in place.
      description: |
        Idempotent, and `If-Match` is ignored: the operation names a statement by identity, so the
        outcome is the same whether or not it was there. Safe to retry, and safe for
        "ensure this triple does not exist" without a prior read.
      parameters:
        - $ref: '#/components/parameters/WriteContext'
      x-sps-requirements: [SPS-CORE-018, SPS-CRUD-042, SPS-CRUD-044, SPS-CRUD-054, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: '`removed`, or `already_absent`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownContext' }

  /_system/sparql/query:
    post:
      tags: [query]
      operationId: sparqlQuery
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: Run a read-only SPARQL query inside the caller's sandbox.
      description: |
        Read-only. Every Update form is rejected, and so is `SERVICE` anywhere in the query,
        including inside a subquery. A malformed query and an Update are refused identically — an
        implementation cannot reliably tell them apart, and reporting the difference tells a prober
        which one they wrote.

        `default-graph-uri` and `named-graph-uri` narrow the query and can never widen it. A
        present-but-empty parameter resolves to the empty set; it does **not** fall back to the
        caller's full readable set.
      parameters:
        - name: default-graph-uri
          in: query
          required: false
          schema: { type: array, items: { type: string, format: uri } }
          explode: true
        - name: named-graph-uri
          in: query
          required: false
          schema: { type: array, items: { type: string, format: uri } }
          explode: true
      x-sps-requirements: [SPS-SPARQL-001, SPS-SPARQL-002, SPS-SPARQL-003, SPS-SPARQL-004, SPS-SPARQL-005, SPS-SPARQL-007, SPS-SPARQL-008, SPS-SPARQL-011, SPS-SPARQL-012, SPS-SPARQL-013, SPS-SPARQL-015, SPS-SPARQL-016, SPS-SPARQL-017, SPS-SPARQL-018, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/sparql-query:
            schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200':
          description: |
            `SELECT` and `ASK` answer SPARQL results JSON; `CONSTRUCT` and `DESCRIBE` answer RDF. An
            empty result is a well-formed document, not an error.
          content:
            application/sparql-results+json:
              schema: { type: object }
            application/ld+json:
              schema: { type: object }
            application/n-quads:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }

  /_system/find:
    get:
      tags: [retrieval]
      operationId: findGet
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: Text in, a context-sandboxed subgraph out.
      parameters:
        - name: text
          in: query
          required: true
          schema: { type: string }
          description: Terms or a natural-language question. How it is interpreted is the implementation's business.
        - name: type
          in: query
          required: false
          schema: { type: array, items: { type: string, format: uri } }
          explode: true
          description: Constrains the hits' `rdf:type`. Repeatable, OR-combined, matched exactly — no subclass reasoning.
        - $ref: '#/components/parameters/ReadContext'
        - $ref: '#/components/parameters/IncludeContexts'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      x-sps-requirements: [SPS-FIND-004, SPS-FIND-005, SPS-FIND-006, SPS-FIND-007, SPS-FIND-008, SPS-FIND-009, SPS-FIND-010, SPS-FIND-011, SPS-FIND-012, SPS-FIND-014, SPS-FIND-015, SPS-FIND-016, SPS-FIND-018, SPS-FIND-019, SPS-FIND-020, SPS-FIND-021, SPS-AUTH-064]
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { $ref: '#/components/responses/FindGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [retrieval]
      operationId: findPost
      security: [{}, { bearerAuth: [] }, { oauth2: [] }]   # anonymous sees the public contexts
      summary: The same operation, for a request that no longer fits in a URL.
      description: The body is parsed strictly — an unknown member is rejected, never ignored.
      x-sps-requirements: [SPS-FIND-004, SPS-FIND-013, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindRequest' }
      responses:
        '401': { $ref: '#/components/responses/BearerUnauthorized' }
        '200': { $ref: '#/components/responses/FindGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /_system/auth/authorize:
    get:
      tags: [auth]
      operationId: authorize
      summary: OAuth 2.1 authorization request.
      description: |
        The standard delegation flow takes no `scope` naming contexts — the authorizing person
        selects them at consent. `scope=public-read` is the exception.
        For a missing or invalid `client_id`, or a missing, invalid or mismatching `redirect_uri`,
        RFC 6749 §4.1.2.1 prohibits automatically redirecting to the invalid client URI.
        How the server informs the resource owner is implementation-defined, including a
        server-owned error page or a redirect to one; no particular status or media type is required.
      security: [{}]
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: |
            Recommended by RFC 6749 §4.1.1. When supplied, echoed unchanged in success and
            error responses sent to the client; omitted from both when absent (`SPS-AUTH-025`).
        - { name: code_challenge, in: query, required: false, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, const: S256 } }
        - { name: scope, in: query, required: false, schema: { type: string } }
        - { name: prompt, in: query, required: false, schema: { type: string } }
      x-sps-requirements: [SPS-AUTH-001, SPS-AUTH-018, SPS-AUTH-056, SPS-AUTH-057, SPS-AUTH-021, SPS-AUTH-022, SPS-AUTH-023, SPS-AUTH-024, SPS-AUTH-025, SPS-AUTH-039, SPS-AUTH-040, SPS-AUTH-041, SPS-AUTH-042, SPS-AUTH-043, SPS-AUTH-044, SPS-AUTH-061]
      responses:
        '302':
          description: |
            Redirect to the validated `redirect_uri` per RFC 6749 §§4.1.2 and 4.1.2.1
            (`SPS-AUTH-025`). Success carries `code`; failure carries `error`, with optional
            `error_description` and `error_uri`. Both echo `state` unchanged when supplied
            in the authorization request and omit it otherwise.
            For failures that cannot be sent to the client, a redirect to a server-owned error
            page is also possible; the client-response parameters and examples do not apply to it.
          headers:
            Location:
              schema: { type: string, format: uri }
              examples:
                successWithState:
                  value: https://app.example/cb?code=example-code&state=s
                successWithoutState:
                  value: https://app.example/cb?code=example-code
                errorWithState:
                  value: https://app.example/cb?error=access_denied&state=s
                errorWithoutState:
                  value: https://app.example/cb?error=access_denied
        '200': { description: The consent screen or an implementation-defined local error page. }
        default:
          description: |
            Implementation-defined handling of failures that cannot be sent to the client.
            The prohibition on redirecting to the invalid client URI still applies; this
            specification does not select a status, representation or local error-page flow.

  /_system/auth/token:
    post:
      tags: [auth]
      operationId: token
      summary: Exchange a code, refresh a token, or obtain a service token.
      security: [{}, { basicAuth: [] }]
      x-sps-requirements: [SPS-AUTH-002, SPS-AUTH-027, SPS-AUTH-028, SPS-AUTH-029, SPS-AUTH-031, SPS-AUTH-032, SPS-AUTH-033, SPS-AUTH-037, SPS-AUTH-038, SPS-AUTH-059, SPS-AUTH-061, SPS-AUTH-062, SPS-AUTH-063]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: The token response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: An OAuth error — including `invalid_scope` for a `scope` on `client_credentials`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: Rate limited.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /_system/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: RFC 7591 dynamic client registration.
      description: |
        Issues a `dyn:` identifier. Such a client registers with no token-endpoint authentication,
        so PKCE is required of it, and it always sees the consent screen. Re-registering with the
        same stable metadata returns the existing identifier rather than minting a new one.
      security: [{}]
      x-sps-requirements: [SPS-AUTH-008, SPS-AUTH-009, SPS-AUTH-010, SPS-AUTH-011, SPS-AUTH-018, SPS-AUTH-056, SPS-AUTH-057, SPS-AUTH-019, SPS-AUTH-020]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: The registration.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }

  /_system/auth/jwks.json:
    get:
      tags: [auth]
      operationId: jwks
      summary: The pod's public signing keys.
      security: [{}]
      x-sps-requirements: [SPS-AUTH-030]
      responses:
        '200':
          description: A JWK Set.
          content:
            application/json:
              schema: { type: object }

  /.well-known/oauth-protected-resource:
    get:
      tags: [auth]
      operationId: protectedResourceMetadata
      summary: The pod's resource and authorization-server identities.
      description: |
        Public JSON at the pod-local append address (SPS-AUTH-067). The resource and sole
        authorization server are the canonical pod base URL. Context IRIs are never listed.
        A Bearer challenge points here; successful public requests need no challenge.
      security: [{}]
      x-sps-requirements: [SPS-AUTH-045, SPS-AUTH-046, SPS-AUTH-047, SPS-AUTH-065, SPS-AUTH-067, SPS-AUTH-068]
      responses:
        '200':
          description: The pod-level metadata document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMetadata' }
              example:
                resource: https://example.org/alice
                authorization_servers: [https://example.org/alice]
                bearer_methods_supported: [header]

  /.well-known/oauth-authorization-server:
    get:
      tags: [auth]
      operationId: authorizationServerMetadata
      summary: The pod's OAuth endpoints and supported methods.
      description: |
        Public JSON at the pod-local append address. SPS-AUTH-067 deliberately replaces
        RFC 8414's host-rooted address construction; issuer validation still uses the exact
        canonical pod base URL. Optional host-rooted routes require deployment support.
      security: [{}]
      x-sps-requirements: [SPS-AUTH-048, SPS-AUTH-066, SPS-AUTH-067, SPS-AUTH-068]
      responses:
        '200':
          description: Authorization Server Metadata for this pod; this example has registered service clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationServerMetadata' }
              example:
                issuer: https://example.org/alice
                authorization_endpoint: https://example.org/alice/_system/auth/authorize
                token_endpoint: https://example.org/alice/_system/auth/token
                registration_endpoint: https://example.org/alice/_system/auth/register
                jwks_uri: https://example.org/alice/_system/auth/jwks.json
                response_types_supported: [code]
                grant_types_supported: [authorization_code, refresh_token, client_credentials]
                token_endpoint_auth_methods_supported: [none, client_secret_basic]
                code_challenge_methods_supported: [S256]


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A pod-issued access token. Its `scope` claim carries feature scopes only — per-context
        grants never travel in a token and are resolved server-side on every request.
    basicAuth:
      type: http
      scheme: basic
      description: A service client's credentials, at the token endpoint only.
    oauth2:
      type: oauth2
      description: |
        The same pod-issued token as `bearerAuth`, described by how a browser client obtains it.
        Authorization Code is the only user-facing flow a pod offers (`SPS-AUTH-001`), against the
        pod's own endpoints (`SPS-AUTH-021`, `SPS-AUTH-027`) — there is no separate authorization
        server, a pod issues and signs its own tokens. PKCE is RECOMMENDED rather than required
        for a `did:web:` client (`SPS-AUTH-023`) — a browser client should send it anyway, and
        `S256` is the only method a pod accepts (`SPS-AUTH-022`).

        A `scope` claim carries **feature scopes** only (`SPS-AUTH-029`). Access to a context is a
        *grant*, resolved server-side per request from durable policy (`SPS-GRANT-001`,
        `SPS-GRANT-002`); it is requested at consent time and never appears in this list.

        `public-read` is the only feature scope this version specifies. `offline_access` is a sempods
        extension a pod may support; it asks about the lifetime of what is issued
        rather than about authority, so it is no feature scope and never appears in this claim. A
        pod may accept further feature scopes; none is promised.

        A client with a stable HTTPS origin identifies as `did:web:<origin>`. The pod parses that
        identifier and never dereferences it (`SPS-AUTH-003`), and the `redirect_uri` has to match
        the identifier's host and port (`SPS-AUTH-004`).

        **The endpoint URLs below name the same placeholder pod as `servers`, and do not follow it.**
        OpenAPI has no way to template them the way a server URL is templated: changing the
        `podBaseUrl` variable moves the operations and leaves these where they are. Substitute your
        pod's base URL here as well. Relative URLs are not the answer — `_system/auth/authorize`
        resolves against `https://example.org/alice` to `https://example.org/_system/auth/authorize`,
        losing the pod, and `SPS-CORE-007` allows a base URL that carries a path.
      # The trade is stated in the description above, where a consumer can read it. For an author:
      # `site/build.py` substitutes these together with the `servers` default when staging, so the
      # published copy names one pod throughout. Writing `{podBaseUrl}` here instead was tried —
      # Scalar drops the whole flow rather than substituting, so the try-it page loses its login.
      flows:
        authorizationCode:
          authorizationUrl: 'https://example.org/alice/_system/auth/authorize'
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          refreshUrl: 'https://example.org/alice/_system/auth/token'
          scopes:
            public-read: >-
              The pod's currently public contexts, unioned into the caller's readable set on top of
              the grants resolved from storage (`SPS-GRANT-020`). With an identity established it
              is an ordinary additive scope.
        # Service clients, which the same token endpoint has to accept (`SPS-AUTH-002`,
        # `SPS-AUTH-027`). No scopes: a service client's reach is its grants, not a scope list.
        clientCredentials:
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          scopes: {}

  parameters:

    ContextPath:
      name: contextPath
      in: path
      required: true
      schema: { type: string }
      description: |
        The context IRI's path, and the same string as the IRI's own. May contain slashes.

    ResourcePath:
      name: resourcePath
      in: path
      required: true
      schema: { type: string }
      description: >-
        Everything after the pod's base URL — not after a pod path segment, which a pod that is an
        entire origin does not have. May contain slashes.

    ResourceIri:
      name: resourceIri
      in: path
      required: true
      schema: { type: string }
      description: An absolute IRI at any scheme, base64url-encoded without padding.

    SubjectIri:
      name: subjectIri
      in: path
      required: true
      schema: { type: string }
      description: base64url without padding.

    PredicateIri:
      name: predicateIri
      in: path
      required: true
      schema: { type: string }
      description: base64url without padding.

    TargetIri:
      name: targetIri
      in: path
      required: true
      schema: { type: string }
      description: base64url without padding. IRI targets only.

    WriteContext:
      name: context
      in: query
      required: true
      schema: { type: string, format: uri }
      description: |
        Exactly one, on every write. Missing or repeated is `400` — and repetition is judged on the
        parameter's occurrence count, so `?context=valid&context=` is repeated. Write failures
        follow `SPS-CORE-018`; an authorized request naming an unregistered context is `404`.

    ReadContext:
      name: context
      in: query
      required: false
      schema: { type: array, items: { type: string, format: uri } }
      explode: true
      description: |
        A downscope filter. Absent means the union of everything the caller may read. Repeat the
        parameter for several — a comma-separated list is not accepted, because a context IRI may
        legally contain a comma. A requested context the caller cannot read is dropped in silence.

    IncludeContexts:
      name: include_contexts
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: |
        Switches the representation to named-graph form grouped by source context. Changes the
        shape only — never which contexts are readable.

    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }

    RegistryAccept:
      name: Accept
      in: header
      required: false
      schema:
        type: string
      description: JSON-LD by default; application/json requests receive application/ld+json. N-Quads is also supported; no acceptable representation gives 406.

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }

    IfNoneMatchSlot:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, const: '*' }
      description: |
        Create-or-fail. Succeeds when the slot holds no statement for `(subject, predicate)` in the
        write context — **not** "the subject does not exist", which would break both an external
        subject and a subject that already has other predicates.

  headers:

    RegistryCacheControl:
      description: >-
        RFC 9111 cache policy satisfying SPS-CTX-036 for every registry response, including errors.
        Stored responses preserve caller/client authorization isolation, current authorization and
        representation freshness. No-store is one sufficient strategy; private storage with mandatory
        revalidation also requires cache selection to distinguish authorization inputs and negotiated
        variants. No particular header combination is prescribed.
      schema: { type: string }
      examples:
        noStore:
          value: no-store
        revalidate:
          summary: Private revalidation with authorization-aware cache selection.
          value: private, no-cache

    EditLinks:
      description: >-
        Optional edit-URL advertisement under SPS-CRUD-058. When present, the Link header
        follows RFC 8288 section 3. Each edit link uses the registered edit relation and
        targets the same resource in this pod through its LOD address, where available,
        or its system-layer resource-node address. The target includes exactly one context
        query parameter carrying the canonical context IRI (SPS-CRUD-007/009).
        Context disclosure, write authorization and conditional request rules still apply.
        No edit-link header is required.
      required: false
      schema: { type: string }
      example: '<https://example.org/alice/contacts/bob?context=https%3A%2F%2Fexample.org%2Falice%2Fcontacts>; rel="edit"'

  responses:

    BearerUnauthorized:
      description: >-
        Missing credentials on a protected operation, or rejected credentials on any bearer
        resource operation. Public access without credentials remains available where specified.
      headers:
        WWW-Authenticate:
          required: true
          description: >-
            RFC 6750 Bearer challenge with the pod-local resource_metadata URL required by
            SPS-AUTH-064. Rejected credentials carry invalid_token.
          schema: { type: string }
          example: 'Bearer error="invalid_token", resource_metadata="https://example.org/alice/.well-known/oauth-protected-resource"'

    RegistryNotModified:
      description: Authorized representation unchanged; no body. Authorization and visibility precede conditional evaluation.
      headers:
        ETag:
          schema:
            type: string
          description: Strong tag for this authorized registry representation.
        Vary:
          schema:
            type: string
          description: Includes Accept.
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'
    RegistryUnauthorized:
      description: >-
        Supplied bearer credentials were rejected; the server does not fall back to anonymous access.
        A request without a token can still use public-read access (SPS-CORE-016).
      headers:
        WWW-Authenticate:
          required: true
          description: >-
            RFC 6750 Bearer challenge with the pod-local resource_metadata URL required by
            SPS-AUTH-064. Rejected credentials carry invalid_token.
          schema: { type: string }
          example: 'Bearer error="invalid_token", resource_metadata="https://example.org/alice/.well-known/oauth-protected-resource"'
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    RegistryNotFoundOrNotVisible:
      description: >-
        The Context does not exist or the caller cannot see it. Bodies, links, validators and cache
        behavior do not distinguish the two cases; registry cache isolation still applies.
      headers:
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    RegistryNotAcceptable:
      description: The `Accept` header cannot be satisfied; registry cache isolation still applies.
      headers:
        Cache-Control:
          $ref: '#/components/headers/RegistryCacheControl'

    ResourceRepresentation:
      description: |
        The resource's statements in the selected contexts. Two JSON-LD shapes, selected by
        `include_contexts`: the merged canonical object by default, and a named-graph array grouped
        by source context when it is `true`. N-Quads is graph-aware by format and unaffected.
      headers:
        ETag: { schema: { type: string } }
        Vary: { schema: { type: string } }
        Link: { $ref: '#/components/headers/EditLinks' }
      content:
        application/ld+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CanonicalResource'
              - $ref: '#/components/schemas/NamedGraphArray'
        application/n-quads:
          schema: { type: string }

    FindGraph:
      description: |
        A subgraph the caller merges and traverses. Flat by default: no ordering, no score, and no
        marker separating a hit from its expansion. An empty result is `200`, not `404` — a search
        that matched nothing is an answer.
      content:
        application/ld+json:
          schema: { type: object }
        application/n-quads:
          schema: { type: string }

    NotFoundOrNotVisible:
      description: |
        Does not exist, or the caller may not see that it does. The two are deliberately
        indistinguishable.

    UnknownContext:
      description: |
        The named context is not registered, and the caller's authority covers the target
        (including the pod owner's implicit authority under `SPS-GRANT-011`).

    WriteTargetNotFound:
      description: |
        The caller's authority covers the target context, but that context is not registered or
        the resource has no statements in it. This includes the pod owner's implicit authority
        under `SPS-GRANT-011`.

    BadRequest:
      description: Malformed request.

    Forbidden:
      description: |
        Authenticated, but lacking the grant or scope the operation requires. When the caller lacks
        the required authority on the target context, neither the status nor the response headers
        or content distinguish whether that context exists (`SPS-CORE-018`).

    NotAcceptable:
      description: The `Accept` header cannot be satisfied.

    Conflict:
      description: Well formed and authorized on arrival; the state changed underneath it.

    PreconditionFailed:
      description: A conditional header did not hold.

  schemas:

    Conformance:
      type: object
      required: [specVersion, modules]
      properties:
        specVersion: { type: string, examples: ['0.1-dev'] }
        modules:
          type: array
          items:
            type: object
            required: [id, version]
            properties:
              id: { type: string, format: uri }
              version: { type: string }
      description: A client must tolerate unknown module identifiers and unknown members.

    RegistryIri:
      type: object
      required:
      - '@id'
      properties:
        '@id':
          type: string
          format: iri
      additionalProperties: false
    RegistryLiteral:
      type: object
      required:
      - '@value'
      properties:
        '@value':
          type:
          - string
          - boolean
          - number
        '@type':
          type: string
          format: iri
        '@language':
          type: string
      additionalProperties: false
      not:
        required:
        - '@type'
        - '@language'
    RegistryNode:
      type: object
      required:
      - '@id'
      - '@type'
      properties:
        '@id':
          type: string
          format: iri
        '@type':
          type: array
          items:
            type: string
            format: iri
          minItems: 1
          uniqueItems: true
      propertyNames:
        anyOf:
        - enum:
          - '@id'
          - '@type'
        - format: iri
      additionalProperties:
        type: array
        items:
          oneOf:
          - $ref: '#/components/schemas/RegistryIri'
          - $ref: '#/components/schemas/RegistryLiteral'
    ContextDescription:
      allOf:
      - $ref: '#/components/schemas/RegistryNode'
      - type: object
        required:
        - http://www.w3.org/ns/sparql-service-description#name
        - https://schema.sempods.org/public
        - http://www.w3.org/2000/01/rdf-schema#seeAlso
        properties:
          '@type':
            contains:
              const: http://www.w3.org/ns/sparql-service-description#NamedGraph
          http://www.w3.org/ns/sparql-service-description#name:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            minItems: 1
            maxItems: 1
          https://schema.sempods.org/public:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: boolean
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#boolean
              additionalProperties: false
            minItems: 1
            maxItems: 1
          http://www.w3.org/2000/01/rdf-schema#seeAlso:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            minItems: 1
          http://www.w3.org/2000/01/rdf-schema#label:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: string
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#string
                '@language':
                  type: string
              additionalProperties: false
              not:
                required: ['@type', '@language']
            minItems: 1
            maxItems: 1
          http://purl.org/dc/terms/description:
            type: array
            items:
              type: object
              required:
              - '@value'
              properties:
                '@value':
                  type: string
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#string
                '@language':
                  type: string
              additionalProperties: false
              not:
                required: ['@type', '@language']
            minItems: 1
            maxItems: 1
          http://purl.org/dc/terms/created:
            type: array
            items:
              type: object
              required:
              - '@value'
              - '@type'
              properties:
                '@value':
                  type: string
                  description: >-
                    An xsd:dateTime lexical form (SPS-CTX-032), including forms without a timezone.
                    JSON Schema's date-time format denotes RFC 3339 and is narrower; this schema
                    checks the string representation and datatype, not XSD lexical validity.
                '@type':
                  const: http://www.w3.org/2001/XMLSchema#dateTime
              additionalProperties: false
            minItems: 1
            maxItems: 1
          https://schema.sempods.org/readableContext: false
          https://schema.sempods.org/writableContext: false
          https://schema.sempods.org/manageableContext: false
      description: Registry RDF about the Context. sd:name equals @id; seeAlso is its derived system resource address. Caller rights and ordinary data are excluded (SPS-CTX-032).
    ContextCatalogue:
      allOf:
      - $ref: '#/components/schemas/RegistryNode'
      - type: object
        properties:
          '@type':
            contains:
              const: http://www.w3.org/ns/sparql-service-description#GraphCollection
          http://www.w3.org/ns/sparql-service-description#namedGraph:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            uniqueItems: true
          https://schema.sempods.org/readableContext:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            uniqueItems: true
          https://schema.sempods.org/writableContext:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            uniqueItems: true
          https://schema.sempods.org/manageableContext:
            type: array
            items:
              $ref: '#/components/schemas/RegistryIri'
            uniqueItems: true
      description: '@id is the catalogue IRI. Relationship sets are complete, with the effective modes of the current caller; empty arrays may be omitted. Rights target visible members and include applicable implied modes (SPS-CTX-033/034).'

    CanonicalResource:
      type: object
      description: |
        The canonical JSON-LD shape: `@id` equal to the resource IRI, absolute IRI predicate keys,
        values as arrays of JSON-LD value objects. No top-level `@context`, no compact terms.
      required: ['@id']
      properties:
        '@id': { type: string, format: uri }
        '@type': {}
      additionalProperties:
        type: array
        items: { $ref: '#/components/schemas/SlotValue' }

    NamedGraphArray:
      type: array
      description: |
        What `include_contexts=true` returns: one entry per source context, each carrying the
        statements that came from it. Only the representation changes — never which contexts are
        readable.
      items:
        type: object
        required: ['@id', '@graph']
        properties:
          '@id':
            type: string
            format: uri
            description: The context IRI the statements came from.
          '@graph':
            type: array
            items: { $ref: '#/components/schemas/CanonicalResource' }

    SlotValues:
      type: array
      items: { $ref: '#/components/schemas/SlotValue' }

    SlotValue:
      oneOf:
        - type: object
          required: ['@id']
          properties:
            '@id': { type: string, format: uri }
        - type: object
          required: ['@value']
          properties:
            '@value': {}
            '@language': { type: string }
            '@type': { type: string, format: uri }

    Outcome:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [created, already_present, cleared, already_empty, removed, already_absent]
      description: |
        The distinction an idempotent status code cannot carry. The same words appear on the
        agent-facing surface, so both report an event identically.

    FindRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
        type: { type: array, items: { type: string, format: uri } }
        contexts: { type: array, items: { type: string, format: uri } }
        include_contexts: { type: boolean, default: false }
        limit: { type: integer, minimum: 1 }

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials]
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        client_id: { type: string }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope:
          type: string
          description: |
            On a refresh, may only narrow the feature scopes. On `client_credentials` it is
            rejected with `invalid_scope`.

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        refresh_token:
          type: string
          description: >-
            Whether one is issued, and for how long it lives, is the implementation's.
            RFC 6749 §4.4.3 keeps it out of a `client_credentials` response.
        scope: { type: string }

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
        error_uri:
          type: string
          format: uri
          description: Optional. A client must treat it as optional.

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers, bearer_methods_supported]
      properties:
        resource:
          type: string
          format: uri
          description: The canonical pod base URL.
        authorization_servers:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, format: uri }
          description: The sole value is the canonical pod base URL.
        bearer_methods_supported:
          type: array
          items: { type: string }
          contains: { const: header }
        scopes_supported:
          type: array
          items: { type: string }
          description: >-
            OAuth scope values advertised by the pod. Per-context permissions are grants and do
            not appear here.
        name: { type: string }
        public_contexts:
          type: integer
          description: A count. Never the URIs.

    AuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, jwks_uri, response_types_supported, grant_types_supported, token_endpoint_auth_methods_supported, code_challenge_methods_supported]
      description: >-
        RFC 8414 fields describing the chapter's endpoints and supported capabilities. Issuer
        equals the canonical pod base URL. client_credentials is listed only if service clients
        are registered (SPS-AUTH-048). Unknown fields remain permitted.
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        registration_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        response_types_supported:
          type: array
          minItems: 1
          items: { type: string }
        grant_types_supported:
          type: array
          minItems: 1
          items: { type: string }
        token_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          items: { type: string }
        code_challenge_methods_supported:
          type: array
          minItems: 1
          items: { type: string }
