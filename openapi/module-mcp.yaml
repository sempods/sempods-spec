openapi: 3.1.0

# MCP transport and its public RFC 9728/8414 discovery routes. Metadata paths use the
# origin server override; the JSON-RPC route continues to use the canonical pod base.

info:
  title: sempods — MCP module
  version: '0.1-dev'
  summary: The per-pod agent-facing endpoint.
  description: |
    Binds only an implementation advertising `https://schema.sempods.org/module/mcp` at the
    conformance endpoint.

    Every tool is a projection of an HTTP surface the core chapters define; the endpoint adds no
    authority, no sandbox and no write path of its own. A hosted multi-pod MCP service is a
    different thing and is not this module — it has no anonymous mode, and toward a pod it is an
    ordinary OAuth client.
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0

externalDocs:
  description: The module chapter
  url: https://github.com/sempods/sempods-spec/blob/main/spec/modules/mcp.md

servers:
  - url: '{podBaseUrl}'
    variables:
      podBaseUrl: { default: 'https://example.org/alice' }

security:
  - {}
  - bearerAuth: []
  - oauth2: []

paths:

  /_system/mcp:
    post:
      operationId: mcp
      summary: JSON-RPC 2.0 — initialize, list tools, call a tool.
      description: |
        Anonymous is a supported mode: with no bearer a caller may initialize, list tools, and use
        the read tools against the pod's public contexts. Write tools require a bearer. An invalid
        bearer is rejected rather than downgraded to anonymous.

        Tool schemas are closed and the closure is **enforced**: a call carrying an argument the
        tool does not declare is refused before dispatch, never silently dropped. The caller is a
        language model, and ignoring an invented argument executes a different operation than the
        one it asked for — broader on a read, wrong on a write — and returns success.
      x-sps-requirements: [SPS-MCP-001, SPS-MCP-002, SPS-MCP-003, SPS-MCP-004, SPS-MCP-005, SPS-MCP-006, SPS-MCP-007, SPS-MCP-008, SPS-MCP-009, SPS-MCP-010, SPS-MCP-011, SPS-MCP-012, SPS-MCP-013, SPS-MCP-017, SPS-MCP-018, SPS-MCP-019, SPS-MCP-020, SPS-MCP-021, SPS-MCP-022, SPS-MCP-023, SPS-MCP-024, SPS-MCP-025, SPS-MCP-027, SPS-MCP-028, SPS-MCP-035, SPS-MCP-038, SPS-AUTH-064]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonRpcRequest' }
      responses:
        '200':
          description: |
            A JSON-RPC response. A tool that failed reports it inside the result rather than as a
            transport error. An authenticated write lacking target-context authority is a tool
            execution error with `result.isError: true` over HTTP `200` (`SPS-MCP-018`). Its headers
            and result do not distinguish an existing context from a nonexistent one; validation
            that depends on context existence does not replace that denial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
              examples:
                writeDenied:
                  summary: The same denial for existing and nonexistent unauthorized contexts.
                  value:
                    jsonrpc: '2.0'
                    id: 1
                    result:
                      isError: true
                      content:
                        - type: text
                          text: Write access denied.
        '202':
          description: A notification, which carries no id and gets no response body.
        '401':
          description: |
            The bearer was rejected, or the operation needs one. The challenge names the pod's realm
            and the endpoint-specific Protected Resource Metadata URL (SPS-MCP-033).
            A token for the pod or another audience is rejected, even with a valid signature.
          headers:
            WWW-Authenticate:
              required: true
              description: >-
                RFC 6750 Bearer challenge with the pod realm and endpoint-specific
                resource_metadata URL required by SPS-MCP-009.
              schema: { type: string }
              example: 'Bearer realm="https://example.org/alice", error="invalid_token", resource_metadata="https://example.org/.well-known/oauth-protected-resource/alice/_system/mcp"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }

  /.well-known/oauth-protected-resource/_system/mcp:
    get:
      operationId: mcpResourceMetadataRoot
      summary: MCP Protected Resource Metadata for a root pod.
      servers:
        - url: '{podOrigin}'
          variables:
            podOrigin: { default: 'https://example.org' }
      security: [{}]
      x-sps-requirements: [SPS-MCP-033, SPS-MCP-035, SPS-AUTH-046, SPS-AUTH-047]
      responses:
        '200':
          description: Public metadata; no authentication required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpProtectedResourceMetadata' }
              example:
                resource: https://example.org/_system/mcp
                authorization_servers:
                - https://example.org
                bearer_methods_supported:
                - header

  /.well-known/oauth-protected-resource/{podPath}/_system/mcp:
    get:
      operationId: mcpResourceMetadataPath
      summary: MCP Protected Resource Metadata for a path-scoped pod.
      servers:
        - url: '{podOrigin}'
          variables:
            podOrigin: { default: 'https://example.org' }
      security: [{}]
      parameters:
        - name: podPath
          in: path
          required: true
          description: >-
            The canonical pod's path without its initial slash. It can contain further slashes;
            OpenAPI tooling that encodes it as one segment cannot express those nested paths.
          schema: { type: string, minLength: 1 }
          example: alice
      x-sps-requirements: [SPS-MCP-033, SPS-MCP-035, SPS-AUTH-046, SPS-AUTH-047]
      responses:
        '200':
          description: Public metadata; no authentication required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpProtectedResourceMetadata' }
              example:
                resource: https://example.org/alice/_system/mcp
                authorization_servers:
                - https://example.org/alice
                bearer_methods_supported:
                - header

  /.well-known/oauth-authorization-server:
    get:
      operationId: mcpIssuerMetadataRoot
      summary: Pod Authorization Server Metadata for a root pod.
      servers:
        - url: '{podOrigin}'
          variables:
            podOrigin: { default: 'https://example.org' }
      security: [{}]
      x-sps-requirements: [SPS-MCP-034, SPS-MCP-035, SPS-AUTH-048, SPS-AUTH-066]
      responses:
        '200':
          description: Public metadata; no authentication required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationServerMetadata' }
              example:
                issuer: https://example.org
                authorization_endpoint: https://example.org/_system/auth/authorize
                token_endpoint: https://example.org/_system/auth/token
                registration_endpoint: https://example.org/_system/auth/register
                jwks_uri: https://example.org/_system/auth/jwks.json
                response_types_supported:
                - code
                grant_types_supported:
                - authorization_code
                - refresh_token
                token_endpoint_auth_methods_supported:
                - none
                code_challenge_methods_supported:
                - S256

  /.well-known/oauth-authorization-server/{podPath}:
    get:
      operationId: mcpIssuerMetadataPath
      summary: Pod Authorization Server Metadata for a path-scoped pod.
      servers:
        - url: '{podOrigin}'
          variables:
            podOrigin: { default: 'https://example.org' }
      security: [{}]
      parameters:
        - name: podPath
          in: path
          required: true
          description: >-
            The canonical pod's path without its initial slash. It can contain further slashes;
            OpenAPI tooling that encodes it as one segment cannot express those nested paths.
          schema: { type: string, minLength: 1 }
          example: alice
      x-sps-requirements: [SPS-MCP-034, SPS-MCP-035, SPS-AUTH-048, SPS-AUTH-066]
      responses:
        '200':
          description: Public metadata; no authentication required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationServerMetadata' }
              example:
                issuer: https://example.org/alice
                authorization_endpoint: https://example.org/alice/_system/auth/authorize
                token_endpoint: https://example.org/alice/_system/auth/token
                registration_endpoint: https://example.org/alice/_system/auth/register
                jwks_uri: https://example.org/alice/_system/auth/jwks.json
                response_types_supported:
                - code
                grant_types_supported:
                - authorization_code
                - refresh_token
                token_endpoint_auth_methods_supported:
                - none
                code_challenge_methods_supported:
                - S256

components:

  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    oauth2:
      type: oauth2
      description: |
        Tokens come from the pod's core OAuth endpoints, with exactly one resource parameter
        equal to the canonical MCP endpoint on authorization and token requests, including refresh.
        They retain the pod issuer and identify only the MCP endpoint in aud (SPS-MCP-036–038).
        A core-surface token is not an MCP credential, and an MCP token cannot be used directly at
        the pod's other protected-resource endpoints. Generic OpenAPI OAuth UI support may not
        supply resource; configure it before using an interactive authorization flow.

        The endpoint URLs name the same placeholder pod as `servers` and do not follow it —
        substitute your pod here as well as there. The core description says why.
      flows:
        authorizationCode:
          authorizationUrl: 'https://example.org/alice/_system/auth/authorize'
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          refreshUrl: 'https://example.org/alice/_system/auth/token'
          scopes:
            public-read: >-
              The pod's currently public contexts, unioned into the caller's readable set on top of
              the grants resolved from storage (`SPS-GRANT-020`). With an identity established it
              is an ordinary additive scope.
        clientCredentials:
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          scopes: {}

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id: { description: Absent on a notification. }
        method:
          type: string
          enum: [initialize, notifications/initialized, tools/list, tools/call, resources/list, prompts/list]
        params: { type: object }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id: {}
        result: { type: object }
        error:
          type: object
          properties:
            code:
              type: integer
              description: |
                Parse error, invalid request, method or tool not found, invalid params, internal
                error — plus a distinct code for a rejected bearer, paired with HTTP 401.
            message: { type: string }

    AuthorizationServerMetadata:
      type: object
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - registration_endpoint
      - jwks_uri
      - response_types_supported
      - grant_types_supported
      - token_endpoint_auth_methods_supported
      - code_challenge_methods_supported
      description: RFC 8414 fields describing the chapter's endpoints and supported capabilities.
        Issuer equals the canonical pod base URL. client_credentials is listed only if
        service clients are registered (SPS-AUTH-048). Unknown fields remain permitted.
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          minItems: 1
          items:
            type: string
        grant_types_supported:
          type: array
          minItems: 1
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          minItems: 1
          items:
            type: string

    McpProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers, bearer_methods_supported]
      properties:
        resource:
          type: string
          format: uri
          description: Exactly the canonical MCP endpoint URL, not its parent pod.
        authorization_servers:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, format: uri }
          description: The canonical pod base URL is the sole issuer.
        bearer_methods_supported:
          type: array
          items: { type: string }
          contains: { const: header }
        scopes_supported:
          type: array
          items: { type: string }
          description: OAuth feature scopes; never context grants or IRIs.
        public_contexts:
          type: integer
          description: A count; never the context IRIs (SPS-AUTH-046).
