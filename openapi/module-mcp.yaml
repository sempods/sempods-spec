openapi: 3.1.0

# The MCP module's Streamable HTTP transport and metadata alias. JSON-RPC methods, tool
# semantics and authorization are owned by the chapter and its pinned standards; this view
# describes their HTTP envelopes, headers, response forms and challenges.

info:
  title: sempods — MCP module
  version: '0.1-dev'
  summary: The per-pod agent-facing endpoint.
  description: |
    Binds only an implementation advertising `https://schema.sempods.org/module/mcp` at the
    conformance endpoint.

    Every tool is a projection of an HTTP surface the core chapters define; the endpoint adds no
    authority, no sandbox and no write path of its own. A hosted multi-pod MCP service is a
    different thing and is not this module — it has no anonymous mode, and toward a pod it is an
    ordinary OAuth client.
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0

externalDocs:
  description: The module chapter
  url: https://github.com/sempods/sempods-spec/blob/main/spec/modules/mcp.md

servers:
  - url: '{podBaseUrl}'
    variables:
      podBaseUrl: { default: 'https://example.org/alice' }

security:
  - {}
  - bearerAuth: []
  - oauth2: []

paths:

  /_system/mcp:
    parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/Origin'
    post:
      operationId: mcp
      summary: JSON-RPC 2.0 — initialize, list tools, call a tool.
      description: |
        Uses [MCP 2025-11-25 Streamable HTTP](https://modelcontextprotocol.io/specification/2025-11-25/basic/transports).
        Every POST MUST send `Accept: application/json, text/event-stream`; clients MUST handle
        either response media type. OpenAPI ignores an `Accept` header parameter, so this
        requirement is stated here alongside the response content definitions.

        Anonymous is a supported mode: with no bearer a caller may initialize, list tools, and use
        the read tools against the pod's public contexts. Write tools require a bearer. An invalid
        bearer is rejected rather than downgraded to anonymous.

        Tool schemas are closed and the closure is **enforced**: a call carrying an argument the
        tool does not declare is refused before dispatch, never silently dropped. The caller is a
        language model, and ignoring an invented argument executes a different operation than the
        one it asked for — broader on a read, wrong on a write — and returns success.
      x-sps-requirements: [SPS-MCP-001, SPS-MCP-002, SPS-MCP-003, SPS-MCP-004, SPS-MCP-005, SPS-MCP-006, SPS-MCP-007, SPS-MCP-008, SPS-MCP-009, SPS-MCP-010, SPS-MCP-011, SPS-MCP-012, SPS-MCP-013, SPS-MCP-017, SPS-MCP-018, SPS-MCP-019, SPS-MCP-020, SPS-MCP-021, SPS-MCP-022, SPS-MCP-023, SPS-MCP-024, SPS-MCP-025, SPS-MCP-027, SPS-MCP-028]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JsonRpcRequest'
                - $ref: '#/components/schemas/JsonRpcNotification'
                - allOf:
                    - $ref: '#/components/schemas/JsonRpcResponse'
                    - required: [id]
      responses:
        '200':
          description: |
            A single JSON response or an SSE stream carrying MCP messages. Servers may choose
            either form. A tool failure is reported in its result.
          headers:
            MCP-Session-Id:
              description: |
                Optional on the response containing InitializeResult. If issued, the client MUST
                send this value on every subsequent HTTP request. Session support is optional.
              schema: { $ref: '#/components/schemas/SessionId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStream' }
        '202':
          description: An accepted JSON-RPC notification or client response; no response body.
        '400': { $ref: '#/components/responses/BadTransportRequest' }
        '403': { $ref: '#/components/responses/InvalidOrigin' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '401': { $ref: '#/components/responses/McpChallenge' }
    get:
      operationId: mcpEvents
      summary: Open or resume an optional MCP event stream.
      description: |
        Clients MUST advertise `text/event-stream` in Accept. The server returns an SSE stream
        or 405 when it does not offer one. A reconnect can carry Last-Event-ID to resume a stream
        originally opened by POST or GET; replay follows the pinned transport's resumability rules.
      x-sps-requirements: [SPS-MCP-007, SPS-MCP-009]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The last received SSE event ID when resuming a disconnected stream.
          schema: { type: string }
      responses:
        '200':
          description: An SSE stream; messages and replay follow the MCP transport contract.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStream' }
        '400': { $ref: '#/components/responses/BadTransportRequest' }
        '401': { $ref: '#/components/responses/McpChallenge' }
        '403': { $ref: '#/components/responses/InvalidOrigin' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '405': { $ref: '#/components/responses/MethodNotSupported' }
    delete:
      operationId: endMcpSession
      summary: Request termination of an MCP transport session.
      description: |
        Applies when the server issued an MCP-Session-Id. Clients SHOULD request termination when
        finished with the session; servers MAY decline client-requested termination with 405.
      x-sps-requirements: [SPS-MCP-007, SPS-MCP-009]
      parameters:
        - name: MCP-Session-Id
          in: header
          required: true
          description: The transport session to terminate.
          schema: { $ref: '#/components/schemas/SessionId' }
      responses:
        '2XX':
          description: The session was terminated; the transport does not prescribe a success body.
        '400': { $ref: '#/components/responses/BadTransportRequest' }
        '401': { $ref: '#/components/responses/McpChallenge' }
        '403': { $ref: '#/components/responses/InvalidOrigin' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '405': { $ref: '#/components/responses/MethodNotSupported' }

  # The append form on the MCP URL. No Authorization Server Metadata stands beside it: the MCP URL
  # is not an issuer identifier, and RFC 8414 §3.3 requires the `issuer` a document serves to match
  # the URL it was fetched from (`SPS-MCP-032`). A description can add a route; it has no way to
  # forbid one.
  /_system/mcp/.well-known/oauth-protected-resource:
    get:
      operationId: mcpProtectedResourceMetadata
      summary: RFC 9728 Protected Resource Metadata, at the MCP URL.
      description: |
        SPS-MCP-031 replaces RFC 9728's host-rooted construction with this append location.
        The response is the pod-level document, with `resource` naming the pod. Consumers use
        the pod URL as the expected resource for validation, including after an MCP challenge.
        This is an explicit resource-identity deviation from generic RFC 9728 discovery.

        Serving the host-rooted location as well is optional. When the deployment omits it,
        the MCP endpoint's `401` challenge supplies the pod-level metadata URL.
      security: [{}]
      x-sps-requirements: [SPS-MCP-031]
      responses:
        '200':
          description: The pod-level metadata document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedResourceMetadata' }

components:

  parameters:
    ProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: false
      description: |
        Required on every request after initialization; SHOULD contain the negotiated version.
        It may be omitted on initialization. Invalid or unsupported values receive 400; missing
        values use the pinned transport's compatibility fallback. The conditional requirement
        cannot be expressed by OpenAPI's operation-wide required flag.
      schema: { type: string }
      example: '2025-11-25'
    SessionId:
      name: MCP-Session-Id
      in: header
      required: false
      description: Required after initialization if the server issued a session ID.
      schema: { $ref: '#/components/schemas/SessionId' }
    Origin:
      name: Origin
      in: header
      required: false
      description: Validated on every connection when present; an invalid origin receives 403.
      schema: { type: string }

  responses:
    McpChallenge:
      description: |
        The bearer was rejected, or the operation needs one. The challenge names the pod's realm
        and its Protected Resource Metadata URL — the pod is the protected resource for an MCP
        caller exactly as for an HTTP caller.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: 'Bearer realm="https://example.org/alice", resource_metadata="https://example.org/alice/.well-known/oauth-protected-resource"'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonRpcErrorResponse' }
    BadTransportRequest:
      description: |
        Invalid or unsupported protocol version, unaccepted input, or a missing session ID where
        the server requires one. An error body is optional.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonRpcErrorResponse' }
    InvalidOrigin:
      description: The supplied Origin is invalid. A JSON-RPC error without an id may be returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonRpcErrorResponse' }
    SessionNotFound:
      description: The session has ended; the client MUST initialize again without the old session ID.
    MethodNotSupported:
      description: The server does not offer this optional transport operation.
      headers:
        Allow:
          required: true
          schema: { type: string }

  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    oauth2:
      type: oauth2
      description: |
        The same pod-issued token the core surface uses, obtained the same way — this module adds
        no authorization surface of its own. `spec/core/auth.md` is where the flow is specified.
        It is repeated here because an OpenAPI description stands alone: a client that authorized
        against the core description holds a credential this one has to name before it may be
        attached, and without that its operations stay anonymous.

        The endpoint URLs name the same placeholder pod as `servers` and do not follow it —
        substitute your pod here as well as there. The core description says why.
      flows:
        authorizationCode:
          authorizationUrl: 'https://example.org/alice/_system/auth/authorize'
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          refreshUrl: 'https://example.org/alice/_system/auth/token'
          scopes:
            public-read: >-
              The pod's currently public contexts, unioned into the caller's readable set on top of
              the grants resolved from storage (`SPS-GRANT-020`). With an identity established it
              is an ordinary additive scope.
        clientCredentials:
          tokenUrl: 'https://example.org/alice/_system/auth/token'
          scopes: {}

  schemas:
    SessionId:
      type: string
      pattern: '^[!-~]+$'
    EventStream:
      type: string
      description: |
        SSE framing containing MCP JSON-RPC messages, with optional event IDs and retry fields.
        Parsing, reconnection and replay follow MCP 2025-11-25 Streamable HTTP.
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          type: [string, integer]
          description: Identifies the request and its response; MCP request IDs cannot be null.
        method:
          type: string
          enum: [initialize, tools/list, tools/call, resources/list, prompts/list]
        params: { type: object }
    JsonRpcNotification:
      type: object
      required: [jsonrpc, method]
      not:
        required: [id]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        method: { type: string, const: notifications/initialized }
        params: { type: object }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      dependentRequired:
        result: [id]
      oneOf:
        - required: [result]
        - required: [error]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          type: [string, integer]
          description: Matches the request ID; may be absent on an error when the request ID could not be read.
        result: { type: object }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: |
                Parse error, invalid request, method or tool not found, invalid params, internal
                error — plus a distinct code for a rejected bearer, paired with HTTP 401.
            message: { type: string }
            data: {}

    JsonRpcErrorResponse:
      allOf:
        - $ref: '#/components/schemas/JsonRpcResponse'
        - required: [error]

    # The core description's schema, copied rather than cross-referenced — an OpenAPI description
    # stands alone. The route above serves the pod-level document, so this is its schema.
    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers, bearer_methods_supported]
      properties:
        resource: { type: string, format: uri }
        authorization_servers: { type: array, items: { type: string, format: uri } }
        bearer_methods_supported: { type: array, items: { type: string } }
        scopes_supported:
          type: array
          items: { type: string }
          description: >-
            OAuth scope values advertised by the pod. Per-context permissions are grants and do
            not appear here.
        name: { type: string }
        public_contexts:
          type: integer
          description: A count. Never the URIs.
