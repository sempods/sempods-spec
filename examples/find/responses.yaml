# Inputs and static Find responses for the eight cases in sempods-spec#147.
# Each jsonld value is a JSON-LD document. Its nquads sibling describes the same dataset.
# The fixture engine matches text in names and descriptions, case-insensitively.
# The caller can read A and B unless a case specifies its readable contexts.
pod: |
  <https://pod.example/articles/42> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://schema.org/Article> <https://pod.example/_system/contexts/A> .
  <https://pod.example/articles/42> <https://schema.org/name> "Harbour map" <https://pod.example/_system/contexts/A> .
  <https://pod.example/articles/42> <https://schema.org/description> "Harbour lantern" <https://pod.example/_system/contexts/B> .
  <https://pod.example/articles/42> <https://schema.sempods.org/findResult> <https://pod.example/notes/saved> <https://pod.example/_system/contexts/A> .
  <https://pod.example/articles/43> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://schema.org/Article> <https://pod.example/_system/contexts/A> .
  <https://pod.example/articles/43> <https://schema.org/name> "Map legend" <https://pod.example/_system/contexts/A> .

plain:
  case: 1
  request: {"text": "harbour"}
  grouped:
    jsonld:
      - "@id": "https://pod.example/_system/contexts/A"
        "@graph":
          - {"@id": "https://pod.example/articles/42", "@type": ["https://schema.org/Article"]}
    nquads: |
      <https://pod.example/articles/42> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://schema.org/Article> <https://pod.example/_system/contexts/A> .
  flat:
    jsonld: {"@id": "https://pod.example/articles/42", "@type": ["https://schema.org/Article"]}
    nquads: |
      <https://pod.example/articles/42> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://schema.org/Article> .

