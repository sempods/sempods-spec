          - {"@id": "https://pod.example/articles/43", "@type": ["https://schema.org/Article"]}
    nquads: |
      <https://pod.example/articles/42> <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> <https://schema.org/Article> <https://pod.example/_system/contexts/A> .
