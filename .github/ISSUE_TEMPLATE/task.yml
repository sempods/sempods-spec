name: Task or iteration
description: Define bounded design, normative adoption, publication or maintenance work, standalone or under a parent.
body:
  - type: markdown
    attributes:
      value: |
        Read [GOVERNANCE.md](https://github.com/sempods/sempods-spec/blob/main/GOVERNANCE.md)
        and [Issue planning](https://github.com/sempods/sempods-spec/blob/main/docs/agents/documentation-strategy.md#issue-planning).
        Search existing issues before filing. Small work can stand alone.
        Maintainers or triagers set relationships, suitable labels and any agreed release milestone.
        You can file this form by supplying issue links; no metadata permissions are required.
        Security reports go privately via the [security policy](https://github.com/sempods/.github/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended result
      description: What is missing, and what will be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Bound this iteration; link the parent goal or proposal where relevant.
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Parent, dependencies and decisions
      description: Link an optional parent and prerequisite issues; identify decisions needed before work starts. Maintainers or triagers set native relationships. Parent membership is not a blocker.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: How will completion be demonstrated? Include applicable checks and follow-up actions; distinguish proposal, adoption and publication.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Run documentation-sync in every PR and record documentation and check evidence.
        Partial PRs link with "Refs"; keep this issue open until all acceptance is verified against merged work.
  - type: textarea
    id: documentation
    attributes:
      label: Documentation completion
      description: Name affected documentation or explain why no update is expected.
    validations:
      required: true
