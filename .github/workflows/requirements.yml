name: Requirements

# `SPS-CORE-003` promises that a requirement identifier is never reassigned, never renumbered and
# never deleted — a retired one is marked withdrawn and keeps its text. That promise is the reason
# an identifier is safe to cite from a conformance suite, an implementation note, or a test report
# this project never sees.
#
# It is also exactly the kind of promise a reviewer stops noticing after the third pull request,
# and deleting a requirement looks like tidying. The pull-request template asks for the check by
# hand; a promise that only a checklist enforces survives precisely as long as reviewers are
# attentive.
#
# Until `0.1` is tagged the deletion half is a notice rather than a failure — GOVERNANCE.md
# §"Deleting and renumbering, before `0.1`". The script decides that, not this file, and it closes
# the window on its own at the tag.

on:
  pull_request:
  push:
    branches: [main]
    # The release tag too. `SPEC_VERSION` still saying `0.1-dev` when `0.1` is pushed publishes a
    # pre-release index at a ref that downstream vendors from and that nobody should move — and a
    # later run on `main` can diagnose that without being able to repair it. Running here is the
    # first moment the mistake is visible, and the last one at which deleting the tag and cutting
    # it again costs nothing.
    tags: ['[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:

  requirements:
    runs-on: ubuntu-latest
    steps:

      # The base of the pull request has to be present locally to diff identifiers against it, so
      # a full clone rather than the default shallow one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identifiers are consistent, and none disappeared
        env:
          # A pull request compares against its base. A push compares against what `main` was
          # immediately before it — otherwise the disappearance half never runs outside a pull
          # request, and a direct push deleting a requirement passes a job whose name says it
          # cannot. `before` is all zeros when a ref is created, which is the one case with
          # nothing to compare against.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-}"
          if [ -z "$BASE" ] && [ -n "${PUSH_BEFORE:-}" ] &&
             [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          fi

          if [ -n "$BASE" ]; then
            echo "comparing identifiers against $BASE"
            .github/scripts/check-requirements.py "$BASE"
          else
            echo "no base to compare against — consistency only"
            .github/scripts/check-requirements.py
          fi

  openapi:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Install OpenAPI validation tools
        run: python3 -m pip install --quiet -r .github/scripts/openapi-requirements.txt

      - name: Validate descriptions and contract examples
        run: python3 .github/scripts/check-openapi.py
