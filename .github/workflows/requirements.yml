name: Requirements

# `SPS-CORE-003` promises that a requirement identifier is never reassigned, never renumbered and
# never deleted — a retired one is marked withdrawn and keeps its text. That promise is the reason
# an identifier is safe to cite from a conformance suite, an implementation note, or a test report
# this project never sees.
#
# It is also exactly the kind of promise a reviewer stops noticing after the third pull request,
# and deleting a requirement looks like tidying. The pull-request template asks for the check by
# hand; a promise that only a checklist enforces survives precisely as long as reviewers are
# attentive.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  requirements:
    runs-on: ubuntu-latest
    steps:

      # The base of the pull request has to be present locally to diff identifiers against it, so
      # a full clone rather than the default shallow one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identifiers are consistent, and none disappeared
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a push to `main` there is no pull-request base; the consistency half still runs,
          # and the disappearance half has nothing to compare against by then anyway.
          if [ -n "${BASE:-}" ]; then
            .github/scripts/check-requirements.py "$BASE"
          else
            .github/scripts/check-requirements.py
          fi

  openapi:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # The descriptions are hand-written, so nothing else parses them. A file that stopped being
      # valid YAML would still pass every other check here and fail only in whatever tool a reader
      # pointed at it.
      - name: The descriptions are well-formed
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path("openapi").glob("*.yaml")):
              try:
                  doc = yaml.safe_load(path.read_text())
              except yaml.YAMLError as e:
                  bad.append(f"{path}: {e}")
                  continue
              if not str(doc.get("openapi", "")).startswith("3.1"):
                  bad.append(f"{path}: not an OpenAPI 3.1 document")
              if not doc.get("paths"):
                  bad.append(f"{path}: no paths")
              print(f"{path.name}: {len(doc.get('paths', {}))} paths")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
