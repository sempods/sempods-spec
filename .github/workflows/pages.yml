name: Pages

# Renders the specification to https://spec.sempods.org.
#
# It runs on pull requests too, and that is the half that matters day to day: a build that only
# runs after merge reports a broken specification page to nobody, on a branch nobody is looking
# at any more. On a pull request it builds and stops; only `main` deploys.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Never two deployments at once, and a superseded run on `main` is pointless work. Pull
  # request runs cancel their own predecessors; a `main` run is allowed to finish, because
  # cancelling mid-deployment is how a site is left half-published.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install the pinned renderer
        run: pip install --require-hashes=false -r site/requirements.txt

      # Fails on a chapter that exists but is in no navigation list, and on a description whose
      # `servers` block stopped matching what the demo-pod substitution looks for — the case
      # where the try-it button would quietly send a reader's requests to example.org.
      - name: Check what the build assumes
        run: python3 site/build.py --check

      # `--strict` inside: a link that resolves nowhere fails the build rather than printing a
      # warning into a log nobody reads.
      - name: Build
        run: python3 site/build.py

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
