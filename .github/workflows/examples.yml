name: Examples

# Check the supplied ACP fixtures, including the proposed composition and deliberate counterexamples.
# A passing run establishes those expectations, not adoption, HTTP behavior or pod conformance.
# Model assumptions and source boundaries: docs/guides/acp-fixtures.md. Future-contract validation
# belongs to issue #72; this job does not replace it.
#
# The ruleset requires this job by name. A rename needs a matching ruleset update; the workflow
# alone neither makes a check required nor changes the name the ruleset waits for.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  examples:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Pinned rather than floating, unlike the `pyyaml` this repository installs for the OpenAPI
      # job. That one only has to parse YAML; this one parses Turtle and decides whether a scenario
      # is correct, so a change in parsing behaviour would quietly change results instead of
      # breaking loudly. The version is the one the transcription of ACP §6 was verified against.
      #
      # `pyparsing` is rdflib's only dependency, and pinning it is what makes the pin mean anything:
      # otherwise a fresh runner resolves whatever is compatible that day, and a required check can
      # go red with nothing in the repository having changed — the failure people learn to merge
      # past. Two names is the whole tree; if rdflib ever grows a third, `--no-deps` and an explicit
      # list is the next step rather than a lockfile.
      #
      # It lives here rather than in a requirements file because `site/` is this repository's only
      # dependency tree and stays its only one — see AGENTS.md §"What this repository deliberately
      # does not have".
      - name: Scenarios agree with ACP's resolution algorithm
        run: |
          set -euo pipefail
          python3 -m pip install --quiet rdflib==7.6.0 pyparsing==3.3.2
          .github/scripts/check-examples.py --self-test
          .github/scripts/check-examples.py

      # These dependencies decide payload acceptance, so the validator stack is pinned along with
      # the RDF parser rather than changing schema behavior on an unrelated CI run.
      - name: Context registry representations agree with their schemas and RDF
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML==6.0.3 jsonschema==4.25.1 attrs==26.1.0 jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.6.3
          python3 .github/scripts/check-context-registry.py
