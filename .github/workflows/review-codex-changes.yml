name: Review Codex changes

# Claude reviews branches Codex opened and no others: elsewhere it would repeat what Codex already
# reports from the same `AGENTS.md`.
#
# The head branch is what identifies the author. `pull_request.user.login` cannot — a bot here
# pushes with a human's credentials, so the author of every pull request in this repository is the
# maintainer and never the agent that wrote the branch.
on:
  pull_request:
    # No `synchronize`: Codex comments on every push already — eleven times on #44 — and a second
    # reviewer at that rate is noise. Once, each time the change is declared ready.
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # The action exchanges a GitHub OIDC token for the Claude app's installation token, and exits
  # before posting the review without this.
  id-token: write

jobs:

  review:
    # `!draft` because a draft opened as a draft fires `opened` as well.
    if: startsWith(github.head_ref, 'codex/') && !github.event.pull_request.draft
    runs-on: ubuntu-latest

    # A ceiling, not a budget. The first real run took five minutes; this is the runaway a review
    # that starts arguing with itself would otherwise become, on an allowance the maintainer also
    # writes with.
    timeout-minutes: 20

    # On the job: a step's own `env` is not in scope for that step's `if`.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The token is absent in forks, where `pull_request` hands out no secrets.
      - name: Review the change
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        # Pinned to a commit rather than to `v1`, for the reason and by the procedure `links.yml`
        # gives at its own pin. That is the second third-party action here; there is no third.
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636  # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # A `prompt` puts the action in automation mode, which posts nothing of its own accord —
          # the review goes to the run log, where the run also hides it. This is the half that
          # makes it arrive: `track_progress` opens a comment when the review starts and keeps it
          # current, and hands Claude the pull request's title, body and comments as context.
          track_progress: true

          # `--allowedTools` is what lets the review be posted at all: the action starts the MCP
          # server behind the inline-comment tool only when this names it, and `gh` is refused
          # without an entry here. `--max-turns` is a ceiling for the same reason as the job
          # timeout, set well above the twenty-five turns the first real run took — a review cut
          # off before it comments is the failure this whole change repairs.
          claude_args: |
            --model claude-opus-5
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a change you did not write.

            Read AGENTS.md, then the documents its "Start here" points at —
            docs/agents/ai-instructions.md and docs/agents/documentation-strategy.md, and
            docs/agents/spec-authoring.md as well if the diff touches spec/. Those carry the rules;
            this prompt does not repeat them.

            Almost everything here is text. Review it on two axes: whether it is right — what it
            leaves open, where two implementers reading it alone would build different things,
            what it contradicts elsewhere in this repository — and whether it keeps the rules you
            have just read, the promise about requirement identifiers and the definition of done
            among them.

            Where the diff touches Python instead — the checkers under .github/scripts/, or
            site/build.py and site/hooks.py — read it as code and say what breaks. A checker that
            silently stops catching what its name claims leaves every change after it unguarded,
            and a green run is not evidence against that.

            Do not report what the checks answer: the ones in AGENTS.md §"Before you commit" run on
            this pull request.

            Post each finding as an inline comment on the line it is about, saying what is wrong
            and why it matters — most severe first, and nowhere else: a finding that stays in your
            answer is a finding nobody reads. If the change is sound, post one comment on the pull
            request saying so in a line. Do not summarise the change either way.
