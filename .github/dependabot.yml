# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  # The workflow and action `uses:` pins, and nothing else — this repository has no build
  # system and therefore no package ecosystem to watch. A pinned action is still a
  # supply-chain dependency, and nothing but this bumps it.
  #
  # A second ecosystem block belongs here the day the conformance suite arrives with a
  # build file, and not before: an entry pointing at a manifest that does not exist is a
  # daily failed run that teaches everyone to ignore the tab.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
