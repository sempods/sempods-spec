# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  # A pinned action is a supply-chain dependency, and nothing but this bumps it.
  #
  # Major bumps stay ungrouped: a major is where the licence changes and not only the API, and
  # a licence change reads as two routine lines when it arrives inside a group PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The renderer behind spec.sempods.org, locked with hashes in `site/requirements.txt`. That
  # lock is what makes the published page reproducible, and it is also what makes the packages
  # invisible to a human reader — twenty-nine of them, pinned to the version that was current
  # the day the site was written and frozen there until something moves them. This is what
  # moves them.
  #
  # Grouped, because a lock is regenerated as a whole: twenty-nine separate pull requests to
  # raise one transitive dependency would each conflict with the last. Majors included, for
  # that same reason — which makes this the one place here where a major arrives without a
  # pull request of its own, and the one place where reading the diff is the only check.
  - package-ecosystem: "pip"
    directory: "/site"
    schedule:
      interval: "weekly"
    groups:
      renderer:
        patterns:
          - "*"
